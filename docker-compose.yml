# ============================================
# ChatBot Hub — Docker Compose
# ============================================
# Levanta todos los servicios necesarios:
#   1. chatbot-hub  (Tu app Node.js principal)
#   2. evolution-api (WhatsApp no oficial por QR — OPCIONAL)
#      + evolution-postgres y evolution-redis (dependencias de Evolution API v2)
#
# USO:
#   docker compose up -d                                  → Solo ChatBot Hub
#   docker compose --profile whatsapp-qr up -d            → ChatBot + Evolution API
#   docker compose logs -f                                → Ver logs en tiempo real
#   docker compose down                                   → Detener todo
#
# NOTA: evolution-api usa un PROFILE, por lo que solo se levanta
#       con el flag --profile whatsapp-qr. Los volúmenes y la red
#       se comparten entre ambos servicios.
# ============================================

services:
  # ============================================
  # 1. ChatBot Hub — Aplicación principal
  # ============================================
  chatbot-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-hub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # La BD SQLite se guarda en /app/data (volumen dedicado SOLO a datos,
      # separado del código para que las actualizaciones de la imagen no queden ocultas)
      - DB_PATH=/app/data/chatbot.sqlite
      # Apuntar a Evolution API dentro de la red Docker (solo aplica si la levantas)
      - EVOLUTION_API_URL=http://evolution-api:8080
    # El código se monta desde el repo (no dentro de la imagen), así los
    # cambios de `git pull` se reflejan sin reconstruir la imagen.
    # node_modules SIEMPRE es el de la imagen (compilado para alpine).
    command: sh -c "node database/seed.js && node --watch server.js"
    volumes:
      # Persistir la base de datos SQLite fuera del contenedor
      - chatbot_data:/app/data
      # Persistir archivos subidos (imágenes, documentos, etc.)
      - chatbot_uploads:/app/uploads
      # Código fuente montado en vivo desde el repo
      - ./server.js:/app/server.js
      - ./src:/app/src
      - ./public:/app/public
      - ./database/schema.sql:/app/database/schema.sql
      - ./database/database.js:/app/database/database.js
      - ./database/seed.js:/app/database/seed.js
    networks:
      - chatbot-network

  # ============================================
  # 2. Evolution API — WhatsApp No Oficial (QR)
  #    Solo se levanta con:  docker compose --profile whatsapp-qr up -d
  #    Requiere PostgreSQL + Redis (v2.x ya no soporta SQLite)
  # ============================================
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    profiles:
      - whatsapp-qr
    ports:
      - "8081:8080"
    depends_on:
      - evolution-postgres
      - evolution-redis
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-chatbot_evolution_key_2026}
      # Base de datos PostgreSQL
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_SAVE_INSTANCES=true
      # Webhook apuntando al contenedor de ChatBot Hub (formato v2.3.x)
      - WEBHOOK_GLOBAL_URL=http://chatbot-hub:3000/webhook/whatsapp-evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=false
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - chatbot-network

  # ============================================
  # 3. PostgreSQL — Base de datos de Evolution API v2
  # ============================================
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    profiles:
      - whatsapp-qr
    environment:
      - POSTGRES_DB=evolution_api
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network

  # ============================================
  # 4. Redis — Cache de Evolution API v2
  # ============================================
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    profiles:
      - whatsapp-qr
    volumes:
      - evolution_redis_data:/data
    networks:
      - chatbot-network

# ============================================
# Volúmenes persistentes
# ============================================
volumes:
  chatbot_data:
    driver: local
  chatbot_uploads:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local
  evolution_postgres_data:
    driver: local
  evolution_redis_data:
    driver: local

# ============================================
# Red interna
# ============================================
networks:
  chatbot-network:
    driver: bridge
