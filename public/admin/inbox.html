<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeja de Entrada — ChatBot Hub</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">
        <div class="brand-icon">💬</div>
        <div class="brand-name">ChatBot Hub</div>
      </div>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">📊 Dashboard</a></li>
        <li><a href="inbox.html" class="nav-link active">💬 Bandeja de Entrada</a></li>
        <li><a href="knowledge.html" class="nav-link">📚 Base de Conocimiento</a></li>
        <li><a href="monitor.html" class="nav-link">📡 Monitoreo</a></li>
        <li><a href="settings.html" class="nav-link">⚙️ Configuración</a></li>
      </ul>

      <div class="user-profile">
        <div class="user-avatar" id="user-avatar" onclick="openProfileModal()" style="cursor:pointer;" title="Mi perfil">A</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role" id="user-role">Administrador</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Cerrar Sesión">🚪</button>
      </div>
    </div>

    <!-- Inbox UI -->
    <div class="main-content" style="overflow: hidden;">
      <div id="alert-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>
      <div class="inbox-container">
        <!-- Sidebar de Conversaciones -->
        <div class="conversations-sidebar">
          <div class="conversations-header">
            <h2 style="font-size: 1.1rem;">Conversaciones</h2>
          </div>
          <div class="conversations-list" id="conversations-list">
            <!-- Conversaciones renderizadas dinámicamente -->
          </div>
        </div>

        <!-- Área de Chat -->
        <div class="chat-area">
          <div class="chat-header" id="chat-header" style="display: none;">
            <div>
              <h3 id="chat-contact-name">Selecciona un chat</h3>
              <p id="chat-contact-info" style="font-size: 0.8rem; color: var(--text-muted);"></p>
              <p id="chat-assignment-info" style="font-size: 0.8rem; margin-top: 4px;"></p>
            </div>
            <div style="display: flex; gap: 10px;">
              <button id="btn-take-conv" class="btn btn-secondary" onclick="takeConversation()" style="display:none;">🙋 Tomar Conversación</button>
              <button id="btn-return-to-bot" class="btn btn-secondary" onclick="returnToBot()" style="display:none;">🤖 Devolver al Bot</button>
              <button id="btn-toggle-status" class="btn btn-secondary" onclick="toggleConversationStatus()">Cerrar Chat</button>
            </div>
          </div>

          <div class="chat-messages" id="chat-messages">
            <div style="margin: auto; color: var(--text-muted); text-align: center;">
              💬 Selecciona una conversación para empezar a responder
            </div>
          </div>

          <div class="chat-input-area" id="chat-input-area" style="display: none;">
            <input type="file" id="img-upload-input" accept="image/*" style="display:none;" onchange="uploadAndSendImage(event)">
            <button class="btn btn-secondary" onclick="document.getElementById('img-upload-input').click()" title="Adjuntar captura/imagen (o Ctrl+V)">📎</button>
            <input type="text" id="msg-input" class="form-control" placeholder="Escribe un mensaje... o pega una imagen (Ctrl+V)" onkeypress="handleKeyPress(event)">
            <button class="btn btn-accent" onclick="sendMessage()">Enviar ➔</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let activeConversationId = null;
    let socket = null;

    function initSocket() {
      function connect() {
        socket = window.socket || io();
        setupSocketListeners();
        loadConversations();
      }

      if (window.socket && window.socket.connected) {
        socket = window.socket;
        setupSocketListeners();
      } else if (window.socket) {
        socket = window.socket;
        socket.on('connect', () => setupSocketListeners());
      } else {
        // Esperar a que app.js cree el socket
        let attempts = 0;
        const check = setInterval(() => {
          if (window.socket && window.socket.connected) {
            clearInterval(check);
            socket = window.socket;
            setupSocketListeners();
          } else if (attempts++ > 20) {
            clearInterval(check);
            socket = io();
            socket.on('connect', () => setupSocketListeners());
          }
        }, 250);
      }
    }

    function setupSocketListeners() {
      console.log('⚡ Inbox: configurando listeners socket');
      loadConversations();  // Cargar al conectar

      socket.on('admin_new_message', (data) => {
        if (activeConversationId === data.conversation_id) {
          appendMessage(data.message);
          scrollChatToBottom();
        }
        loadConversations();
      });

      // Alerta en vivo: un cliente pide atención humana o bug report
      socket.on('admin_alert', (data) => {
        if (data && (data.type === 'human_needed' || data.type === 'bug_report')) {
          showAlert(data);
          playAlertSound();
        }
      });

      socket.on('conversation_updated', () => {
        loadConversations();
      });
    }

    async function loadConversations() {
      try {
        const data = await apiFetch('/conversations');
        const listEl = document.getElementById('conversations-list');
        listEl.innerHTML = '';

        if (data.conversations.length === 0) {
          listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">No hay conversaciones</div>';
          return;
        }

        data.conversations.forEach(conv => {
          const item = document.createElement('div');
          item.className = `conv-item ${activeConversationId === conv.id ? 'active' : ''}`;
          item.onclick = () => selectConversation(conv.id);

          const timeStr = conv.last_message_at ? new Date(conv.last_message_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          const channelName = conv.channel === 'whatsapp_cloud' ? 'WA Cloud' : (conv.channel === 'whatsapp_evolution' ? 'WA QR' : 'Web Chat');

          item.innerHTML = `
            <div class="user-avatar" style="width: 42px; height: 42px; background: #334155;">${(conv.contact_name || 'C')[0].toUpperCase()}</div>
            <div style="flex: 1; overflow: hidden;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 600; font-size: 0.9rem;">${conv.contact_name || 'Cliente'}</span>
                <div style="display: flex; gap: 8px; align-items: center;">
                  <span style="font-size: 0.7rem; color: var(--text-muted);">${timeStr}</span>
                  <button class="btn-delete-conv" data-id="${conv.id}" title="Eliminar conversación" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.85rem;padding:0 4px;opacity:0.5;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">🗑️</button>
                </div>
              </div>
              <div style="font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">
                ${conv.last_message_text || 'Sin mensajes'}
              </div>
              <div style="margin-top: 6px; display: flex; gap: 5px;">
                <span class="badge badge-${conv.channel}">${channelName}</span>
                ${conv.unread_count > 0 ? `<span class="badge badge-unread">${conv.unread_count} nuevos</span>` : ''}
              </div>
            </div>
          `;
          listEl.appendChild(item);
        });

        // Delegación de clicks para botón eliminar
        listEl.onclick = null; // limpiar anterior
        listEl.addEventListener('click', (e) => {
          const deleteBtn = e.target.closest('.btn-delete-conv');
          if (!deleteBtn) return;
          e.stopPropagation();
          e.preventDefault();
          const convId = parseInt(deleteBtn.dataset.id);
          if (!convId) return;
          deleteConversation(convId);
        });
      } catch (err) {
        console.error('Error cargando conversaciones:', err);
      }
    }

    async function selectConversation(id) {
    async function deleteConversation(id) {
      if (!confirm('¿Eliminar esta conversación y todos sus mensajes? Esta acción no se puede deshacer.')) return;
      try {
        await apiFetch(`/conversations/${id}`, { method: 'DELETE' });
        if (activeConversationId === id) {
          activeConversationId = null;
          document.getElementById('chat-messages').innerHTML = '<div class="empty-chat">Selecciona una conversación</div>';
        }
        loadConversations();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      }
    }

    async function selectConversation(id) {
      activeConversationId = id;
      loadConversations();

      try {
        const data = await apiFetch(`/conversations/${id}/messages`);
        const conv = data.conversation;
        const messages = data.messages;

        document.getElementById('chat-header').style.display = 'flex';
        document.getElementById('chat-input-area').style.display = 'flex';
        document.getElementById('chat-contact-name').textContent = conv.contact_name || 'Cliente';
        document.getElementById('btn-toggle-status').textContent = conv.status === 'closed' ? 'Reabrir Chat' : 'Cerrar Chat';

        // Construir línea de info del contacto con sistema, teléfono y email
        const channelLabels = {
          whatsapp_cloud: '📱 WhatsApp (Meta)',
          whatsapp_evolution: '🟢 WhatsApp (QR)',
          webchat: '🌐 Web Chat'
        };
        const channelLabel = channelLabels[conv.channel] || conv.channel;
        let infoLine = channelLabel;
        if (conv.contact_phone) infoLine += ` | Tel: ${conv.contact_phone}`;
        if (conv.contact_email) infoLine += ` | ${conv.contact_email}`;
        // Las notes del contacto contienen "Origen: Sistema de Contabilidad | Rol: Admin"
        if (conv.contact_notes) infoLine += ` | ${conv.contact_notes}`;

        document.getElementById('chat-contact-info').textContent = infoLine;
        updateAssignmentInfo(conv);

        const messagesEl = document.getElementById('chat-messages');
        messagesEl.innerHTML = '';

        messages.forEach(msg => {
          appendMessage(msg);
        });

        scrollChatToBottom();
      } catch (err) {
        console.error('Error cargando chat:', err);
      }
    }

    // Muestra una notificación visual cuando un cliente pide un agente
    function showAlert(data) {
      const container = document.getElementById('alert-container');
      const el = document.createElement('div');

      const isBug = data.type === 'bug_report';
      const borderColor = isBug ? '#ef4444' : '#f59e0b';
      const title = isBug ? '🐛 Reporte de Bug' : '🔔 Solicitud de atención humana';
      const titleColor = isBug ? '#fca5a5' : '#f59e0b';

      el.style.cssText = `background:#1e293b;border:1px solid ${borderColor};border-left:4px solid ${borderColor};border-radius:8px;padding:12px 16px;max-width:320px;box-shadow:0 10px 25px rgba(0,0,0,0.5);animation:slideIn 0.3s ease;`;
      const time = new Date(data.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      el.innerHTML = `
        <div style="font-weight:bold;color:${titleColor};margin-bottom:4px;">${title}</div>
        <div style="font-size:0.9rem;">👤 <strong>${escapeHtml(data.contact_name || 'Visitante')}</strong> · ${escapeHtml(data.channel || '')}</div>
        <div style="font-size:0.85rem;color:var(--text-muted);margin:4px 0;">"${escapeHtml((data.message || '').substring(0, 150))}"</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <span style="font-size:0.75rem;color:var(--text-muted);">${time}</span>
          <button class="btn btn-accent" style="padding:4px 10px;font-size:0.8rem;" onclick="selectConversation(${data.conversation_id}); this.closest('[data-alert]').remove();">Ir al chat →</button>
        </div>
      `;
      el.dataset.alert = '1';
      container.appendChild(el);
      setTimeout(() => { el.remove(); }, 30000);
    }

    // Sonido de alerta (se genera con Web Audio, sin archivo externo)
    function playAlertSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.start();
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(660, ctx.currentTime + 0.2);
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) { /* sonido no disponible */ }
    }

    // Muestra botones "Tomar/Devolver" y quién tiene la conversación asignada
    function updateAssignmentInfo(conv) {
      const infoEl = document.getElementById('chat-assignment-info');
      const takeBtn = document.getElementById('btn-take-conv');
      const returnBtn = document.getElementById('btn-return-to-bot');

      if (conv.assigned_to && conv.assigned_to > 0) {
        const who = conv.assigned_agent_name ? ` (${conv.assigned_agent_name})` : '';
        infoEl.textContent = `👤 Conversación tomada por un agente${who} — el bot está en silencio.`;
        infoEl.style.color = '#f59e0b';
        takeBtn.style.display = 'none';
        returnBtn.style.display = 'inline-block';
      } else {
        infoEl.textContent = '🤖 Conversación atendida por el bot automáticamente.';
        infoEl.style.color = '#10b981';
        takeBtn.style.display = 'inline-block';
        returnBtn.style.display = 'none';
      }
    }

    // El agente toma la conversación (asigna a sí mismo) → el bot se calla
    async function takeConversation() {
      if (!activeConversationId) return;
      const userStr = localStorage.getItem('cb_user');
      let userId = null;
      if (userStr) {
        try { userId = JSON.parse(userStr).id; } catch (e) {}
      }
      try {
        const data = await apiFetch(`/conversations/${activeConversationId}/assign`, {
          method: 'PUT',
          body: JSON.stringify({ userId })
        });
        updateAssignmentInfo(data.conversation);
        loadConversations();
      } catch (err) {
        alert('Error al tomar conversación: ' + err.message);
      }
    }

    // Devuelve la conversación al bot (quita la asignación) → el bot responde
    async function returnToBot() {
      if (!activeConversationId) return;
      if (!confirm('¿Devolver esta conversación al bot? El bot responderá automáticamente.')) return;
      try {
        const data = await apiFetch(`/conversations/${activeConversationId}/assign`, {
          method: 'PUT',
          body: JSON.stringify({ userId: null })
        });
        updateAssignmentInfo(data.conversation);
        loadConversations();
      } catch (err) {
        alert('Error al devolver al bot: ' + err.message);
      }
    }

    function appendMessage(msg) {
      const messagesEl = document.getElementById('chat-messages');
      const bubble = document.createElement('div');
      
      // Detectar reporte de bug
      const isBugReport = msg.text && msg.text.startsWith('🐛 *REPORTE DE BUG*');
      
      let typeClass = 'msg-customer';
      let senderLabel = 'Cliente';
      if (msg.sender_type === 'agent') {
        typeClass = 'msg-agent';
        senderLabel = msg.agent_name || 'Agente';
      } else if (msg.sender_type === 'bot') {
        typeClass = 'msg-bot';
        senderLabel = ' Bot IA';
      } else if (isBugReport) {
        typeClass = 'msg-bug';
        senderLabel = '🐛 Bug Report';
      }

      bubble.className = `msg-bubble ${typeClass}`;
      const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let avatarHtml = '';
      if (msg.sender_type === 'agent' && msg.agent_avatar) {
        avatarHtml = `<img src="${escapeHtml(msg.agent_avatar)}" class="msg-agent-avatar" alt="">`;
      }

      let mediaHtml = '';
      if (msg.media_url && msg.media_type === 'image') {
        mediaHtml = `<a href="${escapeHtml(msg.media_url)}" target="_blank"><img src="${escapeHtml(msg.media_url)}" class="msg-image" alt="Captura"></a>`;
      } else if (msg.media_url && msg.media_type === 'document') {
        mediaHtml = `<a href="${escapeHtml(msg.media_url)}" target="_blank" class="msg-doc">📄 Ver documento</a>`;
      }

      // Para bug reports, renderizar con pre y formato especial
      let textHtml = '';
      if (isBugReport) {
        textHtml = `<pre style="white-space:pre-wrap;font-size:0.82rem;line-height:1.5;margin:0;">${formatBugText(msg.text)}</pre>`;
      } else if (msg.text) {
        textHtml = `<div>${escapeHtml(msg.text)}</div>`;
      }

      bubble.innerHTML = `
        <div style="font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; opacity: 0.8;">${avatarHtml} ${senderLabel}</div>
        ${mediaHtml}
        ${textHtml}
        <span class="msg-time">${timeStr}</span>
      `;

      messagesEl.appendChild(bubble);
    }

    // Resalta negritas en el texto del bug report
    function formatBugText(text) {
      return escapeHtml(text)
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !activeConversationId) return;

      input.value = '';
      try {
        await apiFetch(`/conversations/${activeConversationId}/messages`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });
      } catch (err) {
        alert('Error al enviar mensaje: ' + err.message);
      }
    }

    // Sube la captura/imagen elegida con el botón 📎 y la envía
    function uploadAndSendImage(event) {
      const file = event.target.files[0];
      if (!file || !activeConversationId) return;
      event.target.value = '';
      sendImageFile(file);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    async function toggleConversationStatus() {
      if (!activeConversationId) return;
      const btn = document.getElementById('btn-toggle-status');
      const isClosed = btn.textContent.includes('Reabrir');
      const newStatus = isClosed ? 'open' : 'closed';

      try {
        await apiFetch(`/conversations/${activeConversationId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: newStatus })
        });
        selectConversation(activeConversationId);
      } catch (err) {
        alert('Error cambiando estado: ' + err.message);
      }
    }

    function scrollChatToBottom() {
      const messagesEl = document.getElementById('chat-messages');
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Pega una imagen (Ctrl+V) y la envía automáticamente
    function handlePaste(e) {
      if (!activeConversationId) return;
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          sendImageFile(file);
          return;
        }
      }
    }

    // Sube y envía un archivo de imagen como mensaje
    async function sendImageFile(file) {
      if (!file || !activeConversationId) return;
      const token = localStorage.getItem('cb_token');
      const formData = new FormData();
      formData.append('file', file);
      try {
        const resp = await fetch('/admin/api/upload', {
          method: 'POST',
          headers: token ? { Authorization: `Bearer ${token}` } : {},
          body: formData
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Error al subir');
        await apiFetch(`/conversations/${activeConversationId}/messages`, {
          method: 'POST',
          body: JSON.stringify({
            text: '',
            media_url: data.url,
            media_type: data.media_type
          })
        });
      } catch (err) {
        alert('Error al adjuntar imagen: ' + err.message);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSocket();
      loadConversations();
      document.addEventListener('paste', handlePaste);
    });
  </script>
</body>
</html>
